# =============================================================
# Workflow:     deploy.yml
# Description:  CI/CD pipeline — test, build, deploy to AWS EC2
# Author:       Henry Kumah
# Created:      2026-03-01
# Version:      1.1
# Triggers:     Push to main branch
# Flow:         Test & Validate → Build & Push to ECR →
#               Deploy to EC2 via SSH → Verify → Notify
# =============================================================

name: Deploy to Production

on:
  push:
    branches:
      - main

env:
  AWS_REGION: eu-west-1
  PYTHON_VERSION: "3.11"

jobs:

  # ── Stage 1: Test & Validate ──────────────────────────────────
  test:
    name: Test & Validate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install pytest flake8

      - name: Lint Python scripts
        run: flake8 scripts/

      - name: Validate Bash scripts
        run: |
          sudo apt-get install -y shellcheck
          shellcheck scripts/bootstrap.sh
          shellcheck scripts/aws_setup.sh

      - name: Run unit tests
        run: pytest tests/ -v

  # ── Stage 2: Build & Push to ECR ─────────────────────────────
  build:
    name: Build & Push Docker Image
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Log in to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push Docker image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build -t $ECR_REGISTRY/hfm-app:$IMAGE_TAG .
          docker push $ECR_REGISTRY/hfm-app:$IMAGE_TAG

  # ── Stage 3: Deploy to EC2 ───────────────────────────────────
  deploy:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: build
    environment: production

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Log in to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Run disk maintenance
        run: python3 scripts/disk_maintenance.py

      - name: Deploy new image to EC2
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          # Write the SSH private key to a temp file
          echo "${{ secrets.EC2_SSH_KEY }}" > /tmp/deploy-key.pem
          chmod 600 /tmp/deploy-key.pem

          # SSH into the EC2 instance and deploy the new container
          ssh -o StrictHostKeyChecking=no \
              -i /tmp/deploy-key.pem \
              ubuntu@${{ secrets.EC2_PUBLIC_IP }} << EOF
            # Authenticate Docker with ECR
            aws ecr get-login-password --region ${{ env.AWS_REGION }} | \
              docker login --username AWS --password-stdin $ECR_REGISTRY

            # Pull the latest image
            docker pull $ECR_REGISTRY/hfm-app:$IMAGE_TAG

            # Stop and remove the old container if running
            docker stop hfm-app || true
            docker rm hfm-app || true

            # Start the new container on port 8080
            # Nginx on port 80 proxies all traffic to this container
            docker run -d \
              --name hfm-app \
              --restart always \
              -p 8080:8080 \
              $ECR_REGISTRY/hfm-app:$IMAGE_TAG

            echo "Container deployed successfully"
            docker ps | grep hfm-app
          EOF

          # Clean up key file
          rm -f /tmp/deploy-key.pem

      - name: Verify app is responding
        run: |
          sleep 10
          curl --fail --silent --max-time 10 \
            http://${{ secrets.EC2_PUBLIC_IP }} \
            && echo "App is up and responding on port 80" \
            || echo "WARNING: App did not respond — check container logs"

      - name: Notify team — success
        if: success()
        run: |
          aws sns publish \
            --topic-arn ${{ secrets.SNS_TOPIC_ARN }} \
            --message "Deployment successful — commit ${{ github.sha }} — app live at http://${{ secrets.EC2_PUBLIC_IP }}" \
            --subject "Deploy Success" \
            --region ${{ env.AWS_REGION }}

      - name: Notify team — failure
        if: failure()
        run: |
          aws sns publish \
            --topic-arn ${{ secrets.SNS_TOPIC_ARN }} \
            --message "DEPLOYMENT FAILED — commit ${{ github.sha }} — check pipeline logs at ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            --subject "Deploy FAILED" \
            --region ${{ env.AWS_REGION }}
